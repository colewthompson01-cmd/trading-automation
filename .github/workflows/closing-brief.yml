name: Closing Brief

on:
  schedule:
    - cron: '15 21 * * 1-5'  # 3:15 PM CST (UTC-6, Nov-Mar)
  workflow_dispatch:           # manual trigger from GitHub UI

jobs:
  send-closing-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas pandas_market_calendars requests

      - name: Run closing brief
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python morning_briefing.py --post
