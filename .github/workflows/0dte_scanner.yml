name: 0DTE Scanner

on:
  schedule:
    - cron: '45 14 * * 1-5'  # 8:45 AM CST (UTC-6) Mon-Fri
    - cron: '30 15 * * 1-5'  # 9:30 AM CST (UTC-6) Mon-Fri
  workflow_dispatch:            # manual trigger button on GitHub

permissions:
  contents: write               # needed to commit latest_scan.json back

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet \
            yfinance pandas numpy \
            vaderSentiment \
            alpaca-py \
            pyarrow

      - name: Run scanner
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 0dte_scanner.py --email

      - name: Publish scan results
        run: |
          git config user.name  "0DTE Scanner Bot"
          git config user.email "noreply@github.com"
          git add latest_scan.json
          git diff --staged --quiet || git commit -m "chore: update scan results [skip ci]"
          git push
