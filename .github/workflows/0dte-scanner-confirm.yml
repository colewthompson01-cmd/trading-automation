name: 0DTE Scanner — Confirmation (10 AM CST)

on:
  schedule:
    - cron: '0 16 * * 1-5'   # 10:00 AM CST (UTC-6, Nov-Mar)
  workflow_dispatch:           # manual trigger from GitHub UI

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas pandas_market_calendars requests vaderSentiment

      - name: Run 0DTE scanner (post-open confirmation)
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python 0dte_scanner.py --email
